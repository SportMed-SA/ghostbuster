project_name: ghostbuster

builds:
  - main: ./cmd/ghostbuster
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # GoReleaser automatically grabs the Git tag and injects it into your 'main.Version' variable!
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - format: tar.gz
    # This format applies to Windows binaries (using zip instead of tar.gz)
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
